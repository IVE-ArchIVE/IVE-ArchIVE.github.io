<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ArchIVE</title>

  <style>
    body {
      margin: 0;
      background: #fff7fa;
      color: #444;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    .site-title {
      font-size: 42px;
      letter-spacing: 5px;
      font-weight: 500;
      margin: 0 0 25px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 28px;
      font-size: 15px;
      letter-spacing: 1px;
    }

    nav a {
      color: #555;
      text-decoration: none;
    }

    .search {
      font-size: 18px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 20px;
      letter-spacing: 3px;
      margin-bottom: 25px;
      text-align: center;
    }

    .post {
      background: white;
      margin-bottom: 45px;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #f3dfe6;
    }

    .post-info {
      padding: 18px 5px;
    }

    .date {
      font-size: 12px;
      color: #999;
      letter-spacing: 1px;
    }

    .post-title {
      font-size: 19px;
      margin: 8px 0;
    }

    .tags {
      font-size: 12px;
      color: #c58b9e;
    }
  </style>
</head>

<body>

  <header>

    <h1 class="site-title">ArchIVE</h1>

    <nav>
      <a href="#">HOME</a>
      <a href="#">TAG</a>
      <a href="#">ABOUT</a>
      <a href="#" class="search">⌕</a>
    </nav>

  </header>


  <main>

    <h2 class="section-title">LATEST</h2>


    <article class="post">

      <div class="post-image"></div>

      <div class="post-info">
        <div class="date">2026.08.14 · Instagram</div>

        <div class="post-title">
          WONYOUNG
        </div>

        <div class="tags">
          #WONYOUNG　#IVE　#Instagram
        </div>
      </div>

    </article>


    <article class="post">

      <div class="post-image"></div>

      <div class="post-info">
        <div class="date">2026.08.13 · Event</div>

        <div class="post-title">
          REI
        </div>

        <div class="tags">
          #REI　#IVE　#Event
        </div>
      </div>

    </article>

  </main>

</body>

</html>
